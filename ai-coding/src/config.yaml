# AI Coding 团队通用配置

# 多厂商 LLM 配置
providers:
  # Claude Code 模式 - 使用当前会话模型，无需 API Key
  claude-code:
    enabled: true
    model: "current-session"

  # Anthropic (Claude)
  anthropic:
    enabled: false
    api_key: "${ANTHROPIC_API_KEY}"
    model: "claude-sonnet-4-6"

  # OpenAI (GPT)
  openai:
    enabled: false
    api_key: "${OPENAI_API_KEY}"
    model: "gpt-4o"

  # 阿里通义千问
  ali:
    enabled: false
    api_key: "${DASHSCOPE_API_KEY}"
    model: "qwen-turbo"

  # DeepSeek
  deepseek:
    enabled: false
    api_key: "${DEEPSEEK_API_KEY}"
    model: "deepseek-chat"

  # Kimi (月之暗面)
  kimi:
    enabled: false
    api_key: "${MOONSHOT_API_KEY}"
    model: "moonshot-v1-8k"

  # MiniMax
  minmax:
    enabled: false
    api_key: "${MINMAX_API_KEY}"
    model: "abab6.5s-chat"

  # 智谱GLM
  glm:
    enabled: false
    api_key: "${ZHIPU_API_KEY}"
    model: "glm-4"

# 当前使用的厂商（默认 claude-code，无需 API Key）
active_provider: "claude-code"

# 效能平台 MCP 配置
mcp:
  access_key: "${ACCESS_KEY}"
  base_url: "https://dev.hundsun.com/openapi/apis/v1/mcp"

# 代码仓库映射 (产品编号前缀 -> 仓库路径)
repositories:
  "CP-S000128":
    path: "C:/Users/hspcadmin/Desktop/src"
    name: "O32投资管理系统"
    branch: "ai-coding-dev"
  "CP-S000256":
    path: "D:/repos/otrade"
    name: "O-Trade"
    branch: "develop"

# 任务配置
task:
  max_parallel: 3

# Git 配置
git:
  auto_push: false
  commit_template: "AI Coding: {需求编号} - {任务描述}"